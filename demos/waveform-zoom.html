<!--
  A live specimen of what 10-draw-a-waveform.md and 20-pan-and-zoom.md describe:
  a real mipmap pyramid, a viewport that resolves a level, and a paint loop that
  is a loop over pairs with no arithmetic of its own.

  The pyramid here is built the way the C core builds one -- each level combines
  its children by min-of-mins and max-of-maxes, and RMS as the root of the mean
  of the squares -- so the level readout below is telling the truth rather than
  miming it. Drag to pan, scroll or pinch to zoom.

  Self-contained: scoped styles + one IIFE, colours read from the site's theme
  tokens so it follows the light/dark toggle.
-->
<div class="mwz" data-mono-demo="waveform-zoom">
  <div class="mwz__canvasWrap">
    <canvas class="mwz__canvas" role="img"
            aria-label="An interactive waveform. Drag to pan, scroll to zoom."></canvas>
  </div>

  <div class="mwz__bar">
    <dl class="mwz__stats">
      <div><dt>samplesPerPixel</dt><dd data-mwz="spp">--</dd></div>
      <div><dt>reading level</dt><dd data-mwz="level">--</dd></div>
      <div><dt>pairs drawn</dt><dd data-mwz="pairs">--</dd></div>
    </dl>
    <button class="mwz__reset" type="button" data-mwz="reset">Fit whole file</button>
  </div>

  <p class="mwz__note">
    Drag to pan, scroll or pinch to zoom. The level changes as you zoom, and the
    number of pairs drawn stays bounded by the width of the canvas rather than by
    the length of the audio -- which is the whole point of the pyramid.
  </p>
</div>

<style>
  .mwz {
    margin: 1.5rem 0;
    padding: 16px;
    border-radius: 14px;
    border: 1px solid var(--mono-hairline, #e3e7e8);
    background: var(--mono-surface, #ffffff);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .mwz__canvasWrap {
    border-radius: 10px;
    overflow: hidden;
    background: var(--mono-bg, #090b0c);
    border: 1px solid var(--mono-hairline, #2b3336);
  }
  .mwz__canvas {
    display: block;
    width: 100%;
    height: 160px;
    cursor: grab;
    touch-action: none;
  }
  .mwz__canvas:active { cursor: grabbing; }

  .mwz__bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .mwz__stats {
    display: flex;
    gap: 20px;
    margin: 0;
    flex-wrap: wrap;
  }
  .mwz__stats div { display: flex; flex-direction: column; gap: 2px; }
  .mwz__stats dt {
    font-size: 0.68rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--mono-muted, #67787c);
  }
  .mwz__stats dd {
    margin: 0;
    font-family: var(--sl-font-mono, ui-monospace, monospace);
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--mono-ink, #090b0c);
    font-variant-numeric: tabular-nums;
  }
  .mwz__reset {
    font: inherit;
    font-size: 0.82rem;
    padding: 0.35rem 0.7rem;
    border-radius: 8px;
    cursor: pointer;
    color: var(--mono-brand, #007a55);
    background: var(--mono-brand-soft, #cbf3e0);
    border: 1px solid transparent;
  }
  .mwz__reset:hover { border-color: var(--mono-brand, #007a55); }
  .mwz__note {
    margin: 0;
    font-size: 0.85rem;
    line-height: 1.5;
    color: var(--mono-muted, #67787c);
  }
</style>

<script>
  (function () {
    var root = document.currentScript.previousElementSibling;
    while (root && !root.classList.contains('mwz')) root = root.previousElementSibling;
    if (!root) return;

    var canvas = root.querySelector('.mwz__canvas');
    var ctx = canvas.getContext('2d');
    var out = {
      spp: root.querySelector('[data-mwz="spp"]'),
      level: root.querySelector('[data-mwz="level"]'),
      pairs: root.querySelector('[data-mwz="pairs"]'),
    };

    // ---- A pyramid, built the way the core builds one -------------------
    var BASE = 128;                 // samplesPerPixel at level 0
    var TOTAL = 128 * 60000;        // ~2.7 minutes at 44.1 kHz
    var levels = [];

    (function build() {
      var n = Math.floor(TOTAL / BASE);
      var min = new Float32Array(n), max = new Float32Array(n), rms = new Float32Array(n);
      // A speech-like envelope: phrases with pauses, plus a couple of transients.
      for (var i = 0; i < n; i++) {
        var t = i / n;
        var phrase = Math.max(0, Math.sin(t * Math.PI * 26)) * Math.max(0, Math.sin(t * Math.PI * 3.1));
        var grain = 0.55 + 0.45 * Math.sin(i * 0.7) * Math.cos(i * 0.13);
        var env = phrase * grain;
        if (Math.abs(t - 0.34) < 0.0016 || Math.abs(t - 0.71) < 0.0011) env = 1;  // transients
        // Asymmetric on purpose: this is what an average would erase.
        max[i] = env * (0.82 + 0.18 * Math.sin(i * 0.21));
        min[i] = -env * (0.6 + 0.4 * Math.cos(i * 0.17));
        rms[i] = env * 0.42;
      }
      levels.push({ min: min, max: max, rms: rms, spp: BASE });

      while (levels[levels.length - 1].min.length > 1) {
        var prev = levels[levels.length - 1];
        var m = Math.floor(prev.min.length / 2) || 1;
        var lo = new Float32Array(m), hi = new Float32Array(m), rq = new Float32Array(m);
        for (var j = 0; j < m; j++) {
          var a = j * 2, b = Math.min(a + 1, prev.min.length - 1);
          lo[j] = Math.min(prev.min[a], prev.min[b]);     // min of the mins
          hi[j] = Math.max(prev.max[a], prev.max[b]);     // max of the maxes
          rq[j] = Math.sqrt((prev.rms[a] * prev.rms[a] + prev.rms[b] * prev.rms[b]) / 2);
        }
        levels.push({ min: lo, max: hi, rms: rq, spp: prev.spp * 2 });
      }
    })();

    var finest = BASE;
    var coarsest = levels[levels.length - 1].spp;

    // ---- Viewport --------------------------------------------------------
    var view = { start: 0, spp: 0, width: 0 };

    // Ceil, not floor: pick the coarsest level that still has at least one pair
    // per pixel. Flooring picks a level finer than the zoom, which draws more
    // pairs than the canvas has pixels -- the exact thing the pyramid exists to
    // avoid.
    function levelFor(spp) {
      var idx = Math.ceil(Math.log2(Math.max(spp, finest) / BASE));
      return Math.max(0, Math.min(levels.length - 1, idx));
    }

    function clamp() {
      var maxSpp = Math.max(finest, TOTAL / Math.max(view.width, 1));
      view.spp = Math.max(finest, Math.min(view.spp, maxSpp));
      var span = view.spp * view.width;
      view.start = Math.max(0, Math.min(view.start, Math.max(0, TOTAL - span)));
    }

    function fit() {
      view.spp = TOTAL / Math.max(view.width, 1);
      view.start = 0;
      clamp();
    }

    // ---- Paint -----------------------------------------------------------
    function colours() {
      var s = getComputedStyle(root);
      return {
        brand: s.getPropertyValue('--mono-brand').trim() || '#00bc7d',
        bg: s.getPropertyValue('--mono-bg').trim() || '#090b0c',
      };
    }

    function draw() {
      var dpr = window.devicePixelRatio || 1;
      var cssW = canvas.clientWidth, cssH = canvas.clientHeight;
      if (canvas.width !== cssW * dpr || canvas.height !== cssH * dpr) {
        canvas.width = cssW * dpr;
        canvas.height = cssH * dpr;
      }
      view.width = cssW;
      clamp();

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      var c = colours();
      ctx.clearRect(0, 0, cssW, cssH);
      ctx.fillStyle = c.bg;
      ctx.fillRect(0, 0, cssW, cssH);

      var li = levelFor(view.spp);
      var lvl = levels[li];
      var pixelsPerPair = lvl.spp / view.spp;
      var firstPair = Math.floor(view.start / lvl.spp);
      var xOfFirstPair = (firstPair * lvl.spp - view.start) / view.spp;   // usually slightly negative
      var count = Math.min(
        Math.ceil((cssW - xOfFirstPair) / pixelsPerPair) + 1,
        lvl.min.length - firstPair
      );

      var mid = cssH / 2;
      var scale = cssH / 2 * 0.92;

      // The peak hull, then the RMS core inside it -- two weights of one hue.
      ctx.globalAlpha = 0.42;
      ctx.fillStyle = c.brand;
      for (var i = 0; i < count; i++) {
        var x = xOfFirstPair + i * pixelsPerPair;
        var w = Math.max(pixelsPerPair - (pixelsPerPair > 3 ? 1 : 0), 0.6);
        var top = mid - lvl.max[firstPair + i] * scale;
        var bot = mid - lvl.min[firstPair + i] * scale;
        ctx.fillRect(x, top, w, Math.max(bot - top, 1));
      }
      ctx.globalAlpha = 1;
      for (var k = 0; k < count; k++) {
        var x2 = xOfFirstPair + k * pixelsPerPair;
        var w2 = Math.max(pixelsPerPair - (pixelsPerPair > 3 ? 1 : 0), 0.6);
        var r = lvl.rms[firstPair + k] * scale;
        ctx.fillRect(x2, mid - r, w2, Math.max(r * 2, 1));
      }

      out.spp.textContent = Math.round(view.spp).toLocaleString();
      out.level.textContent = li + ' of ' + (levels.length - 1);
      out.pairs.textContent = Math.max(count, 0).toLocaleString();
    }

    // ---- Gestures --------------------------------------------------------
    var dragging = false, lastX = 0;

    canvas.addEventListener('pointerdown', function (e) {
      dragging = true; lastX = e.clientX;
      canvas.setPointerCapture(e.pointerId);
    });
    canvas.addEventListener('pointermove', function (e) {
      if (!dragging) return;
      view.start -= (e.clientX - lastX) * view.spp;
      lastX = e.clientX;
      draw();
    });
    ['pointerup', 'pointercancel'].forEach(function (t) {
      canvas.addEventListener(t, function () { dragging = false; });
    });

    canvas.addEventListener('wheel', function (e) {
      e.preventDefault();
      var rect = canvas.getBoundingClientRect();
      var focusX = e.clientX - rect.left;
      var anchor = view.start + focusX * view.spp;          // sample under the pointer
      view.spp *= Math.pow(1.0015, e.deltaY);
      clamp();
      view.start = anchor - focusX * view.spp;              // keep it under the pointer
      draw();
    }, { passive: false });

    root.querySelector('[data-mwz="reset"]').addEventListener('click', function () {
      fit(); draw();
    });

    // Follow the site's light/dark toggle, and any resize.
    new MutationObserver(draw).observe(document.documentElement, {
      attributes: true, attributeFilter: ['data-theme'],
    });
    if (window.ResizeObserver) new ResizeObserver(draw).observe(canvas);
    window.addEventListener('resize', draw);

    requestAnimationFrame(function () { view.width = canvas.clientWidth || 640; fit(); draw(); });
  })();
</script>
